# All simulation parameters + seeds. Values are illustrative; rationale goes in reports/assumptions.md.
seed: 20260101

# ---------------- Phase 1: viewer-level experiment (PRD §7.1) ----------------
viewers:
  n_viewers: 500000
  n_weeks: 4
  pre_period_weeks: 4
  assignment: {treatment_share: 0.5, method: hash}
  inject_srm: false            # if true, drop a fraction of treated viewers on one device
  srm: {device: ctv, drop_fraction: 0.10}
  features:
    device: {mobile: 0.60, desktop: 0.25, ctv: 0.15}
    age_bucket: {"18-24": 0.20, "25-34": 0.27, "35-44": 0.22, "45-54": 0.16, "55+": 0.15}
    is_new_viewer: 0.20
    n_countries: 30
    country_zipf_exponent: 1.1
    content_affinity: {gaming: 0.18, music: 0.18, education: 0.12, lifestyle: 0.20, news: 0.14, sports: 0.18}
    pre_watch_minutes: {lognormal_mean: 5.0, lognormal_sigma: 0.8}   # log-scale params, 4-week pre-period
    ad_frequency: {base_per_week: 3.0, watch_minutes_elasticity: 0.35}
  baseline:                    # per-impression rates at control, before heterogeneity
    ctr_by_device: {mobile: 0.020, desktop: 0.015, ctv: 0.008}
    skip_rate_by_device: {mobile: 0.45, desktop: 0.40, ctv: 0.25}
    vtr_by_device: {mobile: 0.35, desktop: 0.40, ctv: 0.60}
    conversion_given_click: 0.08
    conversion_direct_effect_share: 0.10
    negative_feedback_per_1k: 0.8
    organic_minutes_per_week: {lognormal_mean: 4.0, lognormal_sigma: 0.9}
  treatment_effect:
    overall_rel_lift_week1: 0.06
    overall_rel_lift_steady_state: 0.025
    novelty_lambda: 0.7        # decay rate lambda in tau(x,t)
    fatigue: {enabled: true, rate: 0.03, heavy_viewer_multiplier: 2.0}
    segments:                  # relative multipliers on tau_inf / tau_0
      mobile: 1.3
      desktop: 0.5
      ctv: 0.2
      age_18_34: 1.4
      new_viewer: 1.5
      affinity_gaming_lifestyle: 1.3
      desktop_45plus: 0.0      # near zero
      ctv_55plus: -0.8         # negative
    skip_effect: {mobile: -0.03, ctv: 0.03}   # absolute change in skip rate
  sanity_ranges:               # checks in M1 acceptance
    ctr: [0.005, 0.03]
    conversion_rate: [0.005, 0.08]
    skip_rate: [0.15, 0.55]
  robustness_replications: {n_sims: 200, n_viewers: 20000}   # for CI coverage (M3)

