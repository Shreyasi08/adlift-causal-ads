[project]
name = "adlift"
version = "0.1.0"
description = "Measuring the impact of AI-generated video ad creatives (simulated StreamAds platform)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "lightgbm",
  "matplotlib",
  "seaborn",
  "pyyaml",
  "jupyter",
  "nbformat",
]

[project.optional-dependencies]
uplift = ["econml", "causalml", "scikit-uplift", "shap"]
causal = ["linearmodels", "pysyncon", "tfcausalimpact"]
forecast = ["prophet"]
dashboard = ["streamlit", "plotly"]
polars = ["polars"]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adlift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
